interface:
  display_name: "MarketSignal Intelligence"
  short_description: "Research stocks and validate price or excess-return forecasts"
  default_prompt: "Use $market-signal-intelligence to research or compare specified China A shares, B shares, Hong Kong stocks, or US stocks from real data, validate sources, run explainable price forecasts, market-isolated single-asset or panel benchmark-relative excess-return forecasts, or strict out-of-sample model tests when requested, and export traceable Excel reports."

policy:
  allow_implicit_invocation: true
